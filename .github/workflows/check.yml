name: Public template checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_public.py
      - name: Create disposable instance
        run: python scripts/new_agent.py "$RUNNER_TEMP/ethica-check" --agent-id ci-check
      - name: Verify fresh database
        run: |
          python -m pip install 'psycopg[binary]==3.3.9'
          docker compose --project-directory "$RUNNER_TEMP/ethica-check" up -d --wait --wait-timeout 90
          python scripts/verify_database.py "$RUNNER_TEMP/ethica-check"
      - name: Remove disposable database
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ethica-check/compose.yaml" ]; then
            docker compose --project-directory "$RUNNER_TEMP/ethica-check" down --volumes
          fi
